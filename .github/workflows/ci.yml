name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          node scripts/verify.js
          node scripts/verify_math_page.js
          node scripts/verify_architecture.js
          node scripts/verify_shell.js
